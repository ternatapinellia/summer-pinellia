<script>


let images=[];


for(let i=1;i<=11;i++){

images.push(i+".png");

}



let index=0;


let img=document.getElementById(
"productImage"
);



function nextImage(){


index++;


if(index>=images.length){

index=0;

}


img.src=
"../../images/products/tenna/"
+images[index];


}




function prevImage(){


index--;


if(index<0){

index=images.length-1;

}


img.src=
"../../images/products/tenna/"
+images[index];


}


</script>








<script src="../../theme.js"></script>
<script src="../../search.js"></script>





<audio id="bgm" loop></audio>


<div class="music-box">


<div class="music-title">

<span class="music-icon">
🎵
</span>

当前音乐：

<span id="musicName">
未播放
</span>

</div>


<div class="music-line"></div>


<div class="music-controls">


<button class="music-btn small" onclick="prevMusic()">
⏮
</button>


<button id="playBtn" class="music-btn play" onclick="toggleMusic()">
▶
</button>


<button class="music-btn small" onclick="nextMusic()">
⏭
</button>


<select id="mode" onchange="changeMode()">

<option value="loop">
↻ 循环播放
</option>

<option value="single">
↻ 单曲循环
</option>

<option value="random">

</option>

</select>
