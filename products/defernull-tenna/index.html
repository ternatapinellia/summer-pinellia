<script>


let images = [];


for(let i = 1; i <= 18; i++){

images.push(i + ".png");

}



let index = 0;



let img =
document.getElementById("productImage");





function nextImage(){


index++;


if(index >= images.length){

index = 0;

}


img.src =
"../../images/products/spamton/"
+
images[index];


}






function prevImage(){


index--;


if(index < 0){

index = images.length - 1;

}


img.src =
"../../images/products/spamton/"
+
images[index];


}



</script>
