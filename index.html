<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Summer Pinellia</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- 背景音乐 -->

<audio id="bgm" loop></audio>



<div class="container">


<!-- 左侧 -->

<div class="left">



<!-- 图片轮播 -->

<div class="carousel">

<img id="banner" src="images/tv.png">

</div>





<!-- 周边 -->

<section class="products">


<h2>
周边展示
</h2>



<a href="products/index.html">


<img src="images/tb.png">


<p>
角色周边展示
</p>


</a>



</section>



</div>









<!-- 右侧 -->

<div class="right">



<h1>
Summer Pinellia
</h1>




<h2>
文章
</h2>



<div class="articles">


<a href="articles/example/index.html">

示例文章

</a>



</div>







<h2>
项目
</h2>



<div class="projects">


<a href="projects/dnt.html">

DNT桌宠项目

</a>



</div>







<!-- 留言 -->


<div class="comment">


<h2>
留言
</h2>



<textarea 
id="message"
placeholder="留下你的留言">
</textarea>



<button onclick="sendComment()">

发送

</button>



</div>





</div>


</div>







<!-- 音乐控制 -->


<div class="music-box">


当前音乐：

<span id="musicName">

未播放

</span>


<br>



<button onclick="prevMusic()">

上一首

</button>




<button onclick="toggleMusic()">

播放/暂停

</button>




<button onclick="nextMusic()">

下一首

</button>





<select 
id="mode"
onchange="changeMode()">



<option value="loop">

循环播放

</option>




<option value="single">

单曲循环

</option>




<option value="random">

随机播放

</option>



</select>




</div>







<script src="script.js"></script>

<script src="carousel.js"></script>


</body>

</html>
