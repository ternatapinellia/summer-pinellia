<!-- 留言 -->

<!-- 音乐控制 -->


<!-- 音乐控制 -->

<div class="music-box">


<div class="music-title">


<span class="music-icon">
🎵
</span>


当前音乐：

<span id="musicName">

未播放

</span>


</div>




<div class="music-line"></div>




<div class="music-controls">



<button 
class="music-btn small"
onclick="prevMusic()">

⏮

</button>




<button 
id="playBtn"
class="music-btn play"
onclick="toggleMusic()">

▶

</button>




<button 
class="music-btn small"
onclick="nextMusic()">

⏭

</button>





<select 
id="mode"
onchange="changeMode()">



<option value="loop">

↻ 循环播放

</option>



<option value="single">

↻ 单曲循环

</option>



<option value="random">

🔀 随机播放

</option>



</select>
